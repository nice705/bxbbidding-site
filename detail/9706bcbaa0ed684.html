      <html><body><div class="paragraph">
      具备公路工程施工总承包一级及以上资质的投标人应进入交通运输部“全国公路建设市场监督管理系统”（网址：https://hwdms.mot.gov.cn/BMWebSite/）中的公路工程施工资质企业名录，且投标人名称和资质与该名录中的相应企业名称和资质完全一致。具备公路工程施工总承包二级及以下的投标人须已被列入“新疆维吾尔自治区公路建设市场信用信息管理系统”，且投标人名称和资质与系统中相应企业名称和资质完全一致。
      </div></body></html>
