<script>
function customerApp() {
  return {
    activeTab: 'terminal',
    search: '',
    filterRegion: '',
    filterTier: '',
    sortBy: 'count',
    stats: {terminal:0,channel:0,brands:0,high_value:0,updated:'2026-06-06'},
    all: [],
    regions: [],
    filteredTerminal: [],
    filteredChannel: [],
    filteredBrand: [],

    async init() {
      try {
        const resp = await fetch('/data/customers.json');
        const data = await resp.json();
        this.stats = data.stats;
        this.all = data.customers;
        // 提取地区
        const rset = new Set();
        this.all.forEach(c => { if (c.region) rset.add(c.region); });
        this.regions = Array.from(rset).sort();
        this.applyFilters();
      } catch(e) {
        console.error('加载客户数据失败:', e);
      }
    },

    goToDetail(name, type) {
      if (name) {
        window.location.href = '/customer-detail?name=' + encodeURIComponent(name) + '&type=' + type;
      }
    },

    applyFilters() {
      const q = this.search.toLowerCase().trim();
      const region = this.filterRegion;

      const match = (c) => {
        if (q) {
          const n = ((c.buyer||'') + (c.bidder||'')).toLowerCase();
          if (!n.includes(q)) return false;
        }
        if (region && c.region !== region) return false;
        if (this.filterTier && c.tier !== this.filterTier) return false;
        return true;
      };

      const sortFn = (a, b) => {
        if (this.sortBy === 'amount') return (b.amount||0) - (a.amount||0);
        if (this.sortBy === 'date') return (b.date||'').localeCompare(a.date||'');
        return (b.count||0) - (a.count||0); // count default
      };

      this.filteredTerminal = this.all.filter(c => c.category==='terminal' && match(c)).sort(sortFn);
      this.filteredChannel = this.all.filter(c => c.category==='channel' && match(c)).sort(sortFn);
      this.filteredBrand = this.all.filter(c => c.category==='brand' && match(c)).sort(sortFn);
    }
  }
}
</script>

<script>
(async () => {
  const isNonWorkday = await HolidayUtils.init();
  if (isNonWorkday) {
    const homeLink = document.querySelector('nav a[href="/"]');
    const customerLink = document.querySelector('nav a[href="/customers"]');
    if (homeLink) {
      const dot = homeLink.querySelector('.absolute');
      if (dot) dot.style.display = 'none';
      const svg = homeLink.querySelector('svg');
      if (svg) svg.classList.replace('text-emerald-600', 'text-gray-400');
      const span = homeLink.querySelector('span');
      if (span) span.classList.replace('text-emerald-600', 'text-gray-400');
    }
    if (customerLink) {
      const dot = customerLink.querySelector('.absolute');
      if (!dot) {
        const d = document.createElement('span');
        d.className = 'absolute -top-1 w-1 h-1 rounded-full bg-emerald-600';
        customerLink.appendChild(d);
      } else {
        dot.style.display = '';
      }
      const svg = customerLink.querySelector('svg');
      if (svg) svg.classList.replace('text-gray-400', 'text-emerald-600');
      const span = customerLink.querySelector('span');
      if (span) span.classList.replace('text-gray-400', 'text-emerald-600');
    }
  }
})();
